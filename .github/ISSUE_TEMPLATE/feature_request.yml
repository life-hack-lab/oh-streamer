name: 功能建議 / Feature request
description: 提出新功能或改進 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他替代方案 / Alternatives
  - type: markdown
    attributes:
      value: 請勿貼影片標題、網址或本機路徑。 / Do not post video titles, URLs or local paths.
